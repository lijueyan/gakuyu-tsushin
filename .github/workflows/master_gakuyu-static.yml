name: Deploy Gakuyu Static Website to Azure

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static website
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deploy -Force
          Copy-Item index.html, style.css -Destination deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_364266342BCA415CB10D4065DC626BB5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6923968F1EB0431CACF63910F119A18E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DB90CD960B2548B7BC5695E15D5EDC13 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gakuyu-static'
          slot-name: 'Production'
          package: deploy/